<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174d3a"><title>مدارس قطوف الإيمان</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{--g:#174d3a;--g2:#246548;--bg:#f5f8f5;--mint:#eaf3ed;--line:#e0e9e2;--ink:#20332a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.65}.head{background:linear-gradient(120deg,#123c2d,#246548);color:white;padding:18px max(16px,calc((100% - 1050px)/2))}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border:2px solid #d7b45a;border-radius:14px;display:grid;place-items:center;font-size:25px}.brand h1{font-size:18px;margin:0}.brand p{font-size:12px;margin:0;color:#dce9e0}.hero{margin:18px 0 0;padding:18px;border:1px solid #ffffff35;border-radius:18px;background:#ffffff12}.hero h2{margin:0;font-size:clamp(22px,4vw,32px)}.hero p{margin:4px 0 0;color:#e4eee7}.wrap{max-width:1050px;margin:22px auto;padding:0 16px 40px}.search{display:flex;gap:8px;margin-bottom:18px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;font:inherit;background:white}.btn{border:0;background:var(--g);color:white;border-radius:11px;padding:10px 14px;font:inherit;cursor:pointer}.alt{background:var(--mint);color:var(--g);border:1px solid #d5e5d9}.small{font-size:12px;padding:6px 10px}.heading{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.heading h2{font-size:19px;margin:0}.heading p{font-size:12px;color:#718078;margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile,.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 7px 20px #173e2a0d}.tile{text-align:right;cursor:pointer}.ico{width:43px;height:43px;background:var(--mint);border-radius:13px;display:grid;place-items:center;font-size:23px;margin-bottom:8px}.tile b{display:block}.tile small{color:#718078}.items{display:grid;gap:9px}.item{background:white;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}.item h3{font-size:14px;margin:0}.item p{font-size:12px;color:#718078;margin:3px 0 0}.form{display:grid;gap:10px}.form label{font-size:13px;font-weight:bold}.form label input,.form label select,.form label textarea{margin-top:5px;font-weight:normal}.notice{background:#fff7e4;border:1px solid #efdfb6;border-radius:12px;padding:12px;font-size:12px;color:#68551f;margin-bottom:12px}.empty{border:1px dashed #cbd9ce;border-radius:12px;padding:22px;text-align:center;color:#718078}.actions{display:flex;gap:7px;flex-wrap:wrap}footer{text-align:center;background:#eaf1eb;padding:18px;color:#53675a;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.head{padding:14px}.tile{padding:12px}.tile b{font-size:13px}}@media(max-width:390px){.grid{gap:8px}}
</style></head><body>
<header class="head"><div class="brand"><div class="logo">ق</div><div><h1>مدارس قطوف الإيمان</h1><p>النموذجية للبنين</p></div><button class="btn alt small" style="margin-right:auto" onclick="go('admin')">إدارة المحتوى</button></div><div class="hero"><h2>بوابتكم التعليمية</h2><p>خدمات المدرسة ومصادر التعلّم في مكان واحد.</p></div></header>
<main class="wrap"><div class="search"><input id="q" placeholder="ابحث في المحتوى..." oninput="render()"><button class="btn alt" onclick="q.value='';render()">مسح</button></div><div id="app"></div></main><footer>مدارس قطوف الإيمان النموذجية للبنين · نتعلم، نتواصل، نبدع</footer>
<script>
const types={library:'المكتبة الرقمية',worksheet:'أوراق العمل',homework:'الواجبات',timetable:'الجدول الدراسي',announcement:'الإعلانات والأخبار'};
const icons={library:'📚',worksheet:'📝',homework:'📋',timetable:'🗓️',announcement:'📢'};
const seed=[{id:1,type:'announcement',title:'مرحبًا بكم في بوابة المدرسة',desc:'ستُنشر أخبار المدرسة وإعلاناتها هنا.',grade:'عام'},{id:2,type:'library',title:'مكتبة قطوف المعرفة',desc:'رابط المكتبة الرقمية للمدرسة.',grade:'عام'}];
let rows=JSON.parse(localStorage.getItem('qotoofRows')||'null')||seed, cfg=JSON.parse(localStorage.getItem('qotoofCfg')||'{}'), view='home';
function save(){localStorage.setItem('qotoofRows',JSON.stringify(rows));localStorage.setItem('qotoofCfg',JSON.stringify(cfg))}
function go(v){view=v;q.value='';render();scrollTo(0,0)}
function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function items(t){let term=q.value.toLowerCase();let a=rows.filter(x=>(t==='announcements'?x.type==='announcement':x.type===t)&&(!term||[x.title,x.desc,x.grade,x.subject].join(' ').toLowerCase().includes(term))).slice().reverse();return a.length?'<div class="items">'+a.map(x=>`<div class="item"><div><h3>${safe(x.title)}</h3><p>${safe(x.desc)} · ${safe(x.grade)} ${safe(x.subject)}</p></div>${x.url?`<button class="btn small" onclick="window.open('${safe(x.url)}','_blank')">فتح</button>`:''}</div>`).join('')+'</div>':'<div class="empty">لا يوجد محتوى منشور حاليًا.</div>'}
function home(){return `<div class="heading"><div><h2>الخدمات الرئيسية</h2><p>اختر الخدمة المطلوبة</p></div></div><div class="grid">${[['library','المكتبة الرقمية','قطوف المعرفة'],['worksheet','أوراق العمل','مراجعة وتدريب'],['homework','الواجبات','المهام التعليمية'],['timetable','الجدول الدراسي','مواعيد الحصص'],['announcement','الإعلانات والأخبار','آخر مستجدات المدرسة'],['contact','التواصل مع المدرسة','استفسار وملاحظة']].map(([k,t,s])=>`<button class="tile" onclick="go('${k}')"><span class="ico">${k==='contact'?'✉️':icons[k]}</span><b>${t}</b><small>${s}</small></button>`).join('')}</div><div class="heading"><div><h2>أحدث الإعلانات</h2><p>آخر ما تنشره المدرسة</p></div><button class="btn alt small" onclick="go('announcements')">عرض الكل</button></div>${items('announcements')}`}
function admin(){return `<div class="heading"><div><h2>إدارة المحتوى</h2><p>إضافة الواجبات والملفات والإعلانات</p></div><button class="btn alt small" onclick="go('home')">الرئيسية</button></div><div class="notice">نسخة تجريبية: المحتوى يُحفظ على هذا الجهاز فقط. يلزم ربط قاعدة بيانات سحابية حتى تتشارك جميع المعلمين والإدارة المحتوى بين الأجهزة. لا تضف بيانات طلاب شخصية في هذه النسخة.</div><div class="panel"><h3>إضافة محتوى</h3><form class="form" onsubmit="add(event)"><label>القسم<select id="type">${Object.entries(types).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>العنوان<input id="title" required></label><label>التفاصيل<textarea id="desc" rows="3"></textarea></label><label>الصف<input id="grade" placeholder="مثال: الثاني المتوسط"></label><label>المادة<input id="subject" placeholder="مثال: لغتي"></label><label>رابط الملف أو الصفحة<input id="url" type="url" placeholder="https://..."></label><button class="btn">حفظ المحتوى</button></form></div><div class="heading"><h2>المحتوى الحالي</h2></div>${rows.slice().reverse().map(x=>`<div class="item"><div><h3>${safe(x.title)}</h3><p>${types[x.type]}</p></div><button class="btn small" style="background:#8b3b35" onclick="del(${x.id})">حذف</button></div>`).join('')}`}
function contact(){return `<div class="heading"><div><h2>التواصل مع المدرسة</h2><p>نرحب باستفساراتكم ومقترحاتكم</p></div><button class="btn alt small" onclick="go('home')">الرئيسية</button></div><div class="panel"><form class="form" onsubmit="send(event)"><label>الاسم<input id="cname" required></label><label>نوع الرسالة<select id="topic"><option>استفسار عام</option><option>الواجبات وأوراق العمل</option><option>الجدول الدراسي</option><option>اقتراح أو ملاحظة</option></select></label><label>الرسالة<textarea id="msg" rows="4" required></textarea></label><div class="actions"><button class="btn">إرسال بالبريد الإلكتروني</button><button type="button" class="btn alt" onclick="wa()">واتساب المدرسة</button></div><p style="font-size:12px;color:#718078">أضف البريد ورقم واتساب الرسميين من إدارة المحتوى لتفعيل التواصل.</p></form></div>`}
function render(){let a=document.getElementById('app');if(view==='home')a.innerHTML=home();else if(view==='admin')a.innerHTML=admin();else if(view==='contact')a.innerHTML=contact();else{a.innerHTML=`<div class="heading"><div><h2>${view==='announcements'?'الإعلانات والأخبار':types[view]}</h2><p>المحتوى المنشور من المدرسة والمعلمين</p></div><button class="btn alt small" onclick="go('home')">الرئيسية</button></div>${view==='library'&&cfg.library?`<div class="panel" style="margin-bottom:10px"><button class="btn" onclick="window.open('${safe(cfg.library)}','_blank')">الدخول إلى مكتبة قطوف المعرفة</button></div>`:''}${items(view)}`}}
function add(e){e.preventDefault();rows.push({id:Date.now(),type:type.value,title:title.value,desc:desc.value,grade:grade.value,subject:subject.value,url:url.value});save();e.target.reset();alert('تم الحفظ على هذا الجهاز.');render()}
function del(id){if(confirm('حذف هذا العنصر؟')){rows=rows.filter(x=>x.id!==id);save();render()}}
function send(e){e.preventDefault();if(!cfg.email){alert('أضف البريد الرسمي من إدارة المحتوى أولًا.');return}location.href='mailto:'+cfg.email+'?subject='+encodeURIComponent('استفسار من بوابة المدرسة')+'&body='+encodeURIComponent('الاسم: '+cname.value+'\\nالموضوع: '+topic.value+'\\nالرسالة: '+msg.value)}
function wa(){if(!cfg.wa){alert('أضف رقم واتساب المدرسة من إدارة المحتوى أولًا.');return}window.open('https://wa.me/'+cfg.wa.replace(/\\D/g,''),'_blank')}
function settings(){view='settings';render();document.getElementById('app').innerHTML=`<div class="panel"><h2>إعدادات التواصل والمكتبة</h2><form class="form" onsubmit="saveCfg(event)"><label>رابط المكتبة<input id="lib" type="url" value="${safe(cfg.library)}"></label><label>رقم واتساب المدرسة مع مفتاح الدولة<input id="waNum" value="${safe(cfg.wa)}" placeholder="9665xxxxxxxx"></label><label>البريد الرسمي<input id="email" type="email" value="${safe(cfg.email)}"></label><button class="btn">حفظ الإعدادات</button></form><p><button class="btn alt" onclick="go('home')">العودة للرئيسية</button></p></div>`}
function saveCfg(e){e.preventDefault();cfg={library:lib.value,wa:waNum.value,email:email.value};save();alert('تم حفظ الإعدادات.');go('home')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')go('home')});
const oldAdmin=admin;admin=function(){return oldAdmin().replace('<div class="heading"><h2>المحتوى الحالي</h2></div>','<div class="heading"><h2>المحتوى الحالي</h2><button class="btn alt small" onclick="settings()">إعدادات المكتبة والتواصل</button></div>')};
render();
</script></body></html>
